- id: title
  translation: "Informații de bază despre overlay-uri"
- id: metaDescription
  translation: "O scrisoare deschisă despre overlay-uri de accesibilitate"
- id: skip
  translation: "Sari la conținut"
- id: lang
  translation: "Schimbă limba"
- id: tableContent
  translation: "Cuprins"
- id: topic01
  translation: "Ce este un overlay de accesibilitate?"
- id: topic01p01
  translation: "„Overlay” este un termen generic atribuit tehnologiilor care vizează îmbunătățirea accesibilității unui site web. Aceste tehnologii aplică cod sursă extern (de obicei JavaScript) pentru a aduce îmbunătățiri codului front-end al site-ului."
- id: topic01p02
  translation: "Add-on-uri pentru site-uri care pretind că îmbunătățesc accesibilitatea datează de la sfârșitul anilor 1990, cu produse precum <a href=\"https://en.wikipedia.org/wiki/Hoya_Corporation#ReadSpeaker\">Readspeaker</a> și <a href=\"https://en.wikipedia.org/wiki/BrowseAloud\">Browsealoud</a>. Acestea adăugau funcționalități de sintetizare vocală pe site-urile pe care erau instalate."
- id: topic01p03
  translation: "Apoi au apărut pe piață produse similare care au adăugat funcționalități suplimentare propriului software. Acestea ofereau utilizatorilor opțiuni ce permit schimbarea dimensiunii textului sau schimbarea culorilor, pentru a îmbunătăți lizibilitatea."
- id: topic01p04
  translation: "Unele produse overlay mai noi vizează remedierea oricăror probleme din codul site-ului care ar putea împiedica utilizarea cu ușurință a tehnologiei asistive. Acestea aplică pe pagină un script care scanează codul și încearcă să repare automat problemele găsite."
- id: topic01p05
  translation: "Exemple de overlay-uri pentru accesibilitatea site-urilor: (în ordine alfabetică):"
- id: topic01p06
  translation: "*: denotă faptul că aceste produse nu mai sunt dezvoltate sau comercializate."
- id: topic01p07
  translation: "Produsele de tip overlay sunt câteodată produse white-label (vândute sub denumiri diferite), sau rebranduite pentru anumite piețe. Prin urmare aceasta nu este o listă completă a produselor de acest tip discutate în această pagină."
- id: topic02
  translation: "Avantajele și dezavantajele widgeturilor overlay"
- id: topic02p01
  translation: "Widgeturile overlay sunt inutile și sunt plasate inadecvat în stiva de tehnologii."
- id: topic02p02
  translation: "După cum s-a menționat mai sus, unele produse de tip overlay conțin widget-uri care prezintă o serie de controale ce modifică prezentarea paginii pe care se află. În funcție de produs, aceste modificări pot avea ca efect: schimbarea contrastului paginii, mărirea dimensiunii textului paginii sau efectuarea altor modificări ale paginii menite să îmbunătățească experiența utilizatorilor cu dizabilități."
- id: topic02p03
  translation: "Pentru persoanele în necunoștință de cauză, aceste funcționalități par benefice, dar valoarea lor practică este supraevaluată. Utilizatorii vizați de aceste funcționalități vor avea deja funcționalitățile necesare pe calculatorul lor, fie ca o funcționalitate integrată, fie sub forma unui program pe care utilizatorul îl folosește, nu numai pentru a accesa site-uri web, ci și pentru a utiliza alte programe."
- id: topic02p04
  translation: "Referitor la acest ultim aspect, este greșit să credem că aceste funcționalități oferite de widgeturi overlay vor fi de mare folos utilizatorilor, întrucât dacă aceste funcționalități erau <strong>necesare</strong> pentru a putea utiliza un site, ar fi fost necesare pentru toate site-urile cu care utilizatorul interacționează. De fapt, widgetul oferă, în cel mai bun caz, funcționalitate redundantă comparativ cu ce folosește deja utilizatorul."
- id: topic03
  translation: "Avantajele și dezavantajele remedierii automate"
- id: topic03p01
  translation: "Deși remedierea automată este posibilă într-o anumită măsură, clienții trebuie descurajați din a folosi un overlay drept soluție pe termen lung."
- id: topic03p02
  translation: "Unele produse overlay au funcționalități menite să ofere remedieri de accesibilitate pe pagina pe care este adăugat overlay-ul. Aceste remedieri se aplică atunci când pagina este încărcată în browserul utilizatorului."
- id: topic03p03
  translation: "Deși este adevărat că o serie de probleme non-triviale de accesibilitate pot fi remediate în acest fel, natura, amploarea, și acuratețea acestor remedieri sunt limitate de un număr de factori importanți:"
- id: topic03p04
  translation: "Aplicarea automată a alternativelor text pentru imagini nu este fiabilă"
- id: topic03p05
  translation: "Remedierea automată în cazul etichetelor câmpurilor de formular, gestionarea erorilor și controlul focusului în câmpurile de formular, nu este fiabilă"
- id: topic03p06
  translation: "Remedierea automată a accesului cu tastatura nu este fiabilă"
- id: topic03p07
  translation: "Interfețele de utilizator moderne bazate pe componente, cum sunt cele ce utilizează ReactJS, Angular, sau Vue, pot schimba oricând starea întregii pagini sau a unei porțiuni din pagină, independent de overlay. Prin urmare nu mai este posibil ca overlay-ul să remedieze aceste schimbări de conținut cauzate de codul JavaScript"
- id: topic03p08
  translation: "Remedierile aplicate paginilor pot încetini timpul de încărcare al acestora sau pot cauza schimbări neașteptate pentru utilizatorii de tehnologie asistivă."
- id: topic03p09
  translation: "În plus, overlay-urile nu remediază conținut Flash, Java, Silverlight, PDF, HTML5 Canvas, SVG, sau fișiere multimedia."
- id: topic04
  translation: "Capacitatea de a respecta standardele de accesibilitate"
- id: topic04p01
  translation: "Deși utilizarea unui overlay poate îmbunătăți conformitatea cu o parte din prevederile din standardele majore de accesibilitate, conformitatea deplină nu poate fi obținută cu un overlay."
- id: topic04p02
  translation: "Printre numeroasele afirmații făcute de furnizorii de overlay-uri se regăsește și afirmația că utilizarea produsului lor va aduce site-ul în conformitate cu standardele de accesibilitate, precum WCAG 2.x, standardele înrudite și derivate și legile care impun conformitatea cu aceste standarde."
- id: topic04p03
  translation: "Conformitatea cu un standard înseamnă îndeplinirea sau satisfacerea „cerințelor” standardului (<i lang=\"en\">‘requirements’</i>). În WCAG 2.0, „cerințele” sunt criteriile de succes (<i lang=\"en\">success criteria</i>). Pentru a vă conforma cu WCAG 2.0, trebuie să îndepliniți criteriile de succes, adică să nu existe conținut care să încalce criteriile de succes."
- id: topic04p04
  translation: "Considerând definiția conformității ca fiind îndeplinirea tuturor cerințelor standardului, incapacitatea acestor produse overlay de a remedia <strong>toate</strong> problemele posibile denotă faptul că overlay-urile nu pot aduce site-ul în conformitate. Produsele comercializate cu astfel de afirmații ar trebui privite cu un scepticism semnificativ."
- id: topic05
  translation: "Confidențialitatea datelor personale"
- id: topic05p01
  translation: "Adăugarea unui overlay în propriu site poate contracara preferințele utilizatorilor de a avea confidențialitate și poate crea riscul de nerespectare a RGPD, <i lang=\"en\">UK GDPR</i>, <i lang=\"en\">CCPA</i>, ș.a.m.d."
- id: topic05p02
  translation: "Overlay-urile care activează automat anumite setări, cum ar fi cele pentru cititorul de ecran (<i lang=\"en\">screen reader</i>) sau utilizatorii de recunoaștere a vorbirii (<i lang=\"en\">speech recognition</i>), fac acest lucru prin detectarea tehnologiilor de asistență ce rulează pe dispozitivul utilizatorului. Acest lucru expune faptul că persoana care folosește dispozitivul în acel moment are o dizabilitate. În anumite cazuri, cum ar fi utilizatorii de cititoare de ecran în care majoritatea sunt orbi sau au vedere scăzută, sunt expuse și mai multe detalii despre natura dizabilității lor. La fel ca vârsta, originea etnică sau genul preferat, dizabilitățile sunt informații personale confidențiale. Acestea nu sunt date care ar trebui colectate fără consimțământul informat al persoanei căreia îi aparțin."
- id: topic05p03
  translation: "S-a descoperit că unele overlay-uri păstrează setările utilizatorilor pe diverse site-uri care folosesc același overlay. Acest lucru se face prin setarea unui <i lang=\"en\">cookie</i> pe calculatorul utilizatorului. Când utilizatorul activează o setare pentru o funcționalitate de overlay pe un site, overlay-ul va activa automat acea funcționalitate și pe alte site-uri. Deși compania de overlay ar putea crede că vine în ajutorul utilizatorului, marea problemă de confidențialitate este că utilizatorul nu a consimțit niciodată să fie urmărit și, de asemenea, utilizatorul nu are opțiunea de a renunța la această funcționalitate. Din cauza acestei lipse de opțiuni de renunțare (alta decât dezactivarea explicită a acelei setări), acest lucru creează un risc pentru Regulamentului General privind Protecția Datelor (RGPD) și <i lang=\"en\">California Consumer Privacy Act (CCPA)</i> pentru clientul ce folose;te un overlay."
- id: topic06
  translation: "In their own words"
- id: topic06p01
  translation: "Many users with disabilities have expressed strong words of dissatisfaction with overlay products. As shown below, overlays themselves may have accessibility problems significant enough for users to take steps to actively block overlays from appearing at all."
- id: topic06p02
  translation: "Please note: while this section may mention specific vendors, these comments are par-for-the-course when it comes to the user experience provided by overlay widgets which have, in themselves, a pattern of negatively impacting the user experience."
- id: topic06t01
  translation: "...assuming your tool can do a good job making something accessible, it can do an even better job making something accessible running directly on the user’s machine having access to machine code and machine APIs"
- id: topic06t02
  translation: "...I finally managed to gain access to my @NameCheap account by blocking #AccessiBe in my Windows Hosts file. I should not need to do this to use the Internet. AccessiBe needs to AccessiBeGone"
- id: topic06t03
  translation: "...I know with 100% certainty, any site which has deployed an overlay in the past year and a half has been less useable for both my wife and me—both blind."
- id: topic06t04
  translation: "...Still a pain to even try reading the article on a mobile device because of the constant interruption every few seconds. Considering every site using your service also has this problem… Nope."
- id: topic06t05
  translation: "...Making a webpage accessible does take work, and simply telling a business they can install your plugin is absolutely foolish, you build, and design accessibility in to a webpage using WCAG standards."
- id: topic06t06
  translation: "...Suggesting one line of code is cheap so you should do it by inference suggests disabled lives aren’t worth investing in either. #a11y"
- id: topic06t07
  translation: "@AccessiBe Just to demonstrate my good faith, here’s a quick free audit of https://t.co/1mQGCCtnIs. You capture \"tab\" which is the standard way to navigate. There’s no way to not enable your overlay if I want to navigate the page. Once the overlay is enabled, wild things happen."
- id: topic06t08
  translation: "#AccessiBe makes sites harder to use by getting in the way of browsing and changing access barriers on a page, not fixing them. A student and I came across an \"enhanced\" website and to my shame, we left because navigating that mess was beyond my skills, on that day."
- id: topic06t09
  translation: "Accessibility overlays are not the answer, and AccessiBe is no exception. As a screen reader user, numerous sites have become less usable for me with this overlay. Discrediting reputable accessiblity professionals and advocates will not sway me on this view. https://t.co/ZgFt8JtsbZ"
- id: topic06t10
  translation: "To screen reader-using followers: You may have heard of #Accessibe, an overlay that claims to make pages in which it is embedded more accessible. I won’t go into any more detail. In short: complete nonsense. Hands off!"
- id: topic06t11
  translation: "Automated solutions which promise to make your site accessible can’t. It takes more than automation to achieve this requirement. You won’t be safe from liability. you will almost assuredly negatively impact your customers with disabilities."
- id: topic06t12
  translation: "Every time I go on a website and I hear the #accessiBe notification that this site is adjusted to my screen reader, I know that my blocker isn’t working properly, and I’m in for a hellish experience on that particular website. https://t.co/ZFzKMfUe0t"
- id: topic06t13
  translation: "I tried using this @AccessiBe site with VoiceOver in Chrome on iOS. The 4-star rating is announced as \"unpronounceable\" 🤦‍♀️ https://t.co/f4MxQ2eLLP"
- id: topic06t14
  translation: "I wrote an email to their customer service detailing that I can not use their site due to the overlay, but… I really am disappointed, but I hope they listen. @Goodfair_ - please stop using AccessiBe."
- id: topic06t15
  translation: "I’m not an accessibility expert, just a screen reader user with decent skills telling you that this thread is spot on and my experience with #AccessiBe is that it makes sites with accessibility issues even harder to work around. https://t.co/cfyrEqXwTy"
- id: topic06t16
  translation: "...If you are blind or low vision and rely on assistive technologies like screen readers, you may have begun finding popular websites becoming less usable… this page describes how to ban AccessiBe from ever reaching your computer… https://t.co/qbiKvolizS"
- id: topic06t17
  translation: "OK, this seems very wrong to me. A local chain here named Fleet Farm is now using AccessiBe. It makes a mess of the search for location feature. This is what I now get on the start of the result page."
- id: topic06t18
  translation: "Thank goodness Firefox blocks their accessibility detection. For me, focus jumps all over the place with #AccessiBe enabled. When it’s disabled, it behaves itself."
- id: topic06t19
  translation: "There are 0 automated tools that can tetect accessibility problems accurately at anything above 30% of the time. 0. This is commonly known by anyone who’s been in this space for at least a week. #AccessiBe"
- id: topic06t20
  translation: "There’s a perfectly practical tool for making websites accessible. It’s called a programmer. The needs that matter in making a website accessible are those of the users. If you can’t meet those, then you can’t meet the basic costs of doing business."
- id: topic06t21
  translation: "When #AccessiBe is enabled, the page is flooded with headings. Lots of heading level 2’s. The title of each phone remains a heading in both versions of the page, but with it enabled, things like cost, display, and all the other components of the tables become headings as well."
- id: topic07
  translation: "Conclusion"
- id: topic07p01
  translation: "No overlay product on the market can cause a website to become fully compliant with any existing accessibility standard and therefore cannot eliminate legal risk."
- id: topic07p02
  translation: "Accessibility on the Web is a big challenge, both for owners of websites and for the users of those websites. The invention of novel approaches to resolving this challenge is to be commended."
- id: topic07p03
  translation: "However, in the case of overlays—especially those which attempt to add widgets that present assistive features—the challenge is not being met. Even more problematic is the deceptive marketing provided by some overlay vendors who promise that implementing their product will give their customer’s sites immediate compliance with laws and standards."
- id: topic07p04
  translation: "The ineffectiveness of overlays is something that has broad agreement among accessibility practitioners, per the <a href=\"https://webaim.org/projects/practitionersurvey3/#overlay\">WebAIM Survey of Web Accessibility Practitioners</a> which found:"
- id: topic07p05
  translation: "A strong majority (67%) of respondents rate these tools as not at all or not very effective. Respondents with disabilities were even less favorable with 72% rating them not at all or not very effective, and only 2.4% rating them as very effective."
- id: topic08
  translation: "Statement from sponsors and signatories to this fact sheet"
- id: topic08p01
  translation: "As a result of the above information:"
- id: topic08p02
  translation: "We will never advocate, recommend, or integrate an overlay which deceptively markets itself as providing automated compliance with laws or standards"
- id: topic08p03
  translation: "We will always advocate for the remediation of accessibility issues at the source of the original error"
- id: topic08p04
  translation: "We will refuse to stay silent when overlay vendors use deception to market their products"
- id: topic08p05
  translation: "More specifically, we hereby advocate for the removal of web accessibility overlay and encourage the site owners who've implemented these products to use more robust, independent, and permanent strategies to making their sites more accessible"
- id: topic08p06
  translation: "Signed by:"
- id: topic08p07
  translation: "Some overlay vendors have attempted to frame the overlay factsheet as an effort by their competitors to discredit them. Such overlay claims are a textbook case of an attempt to <a href=\"https://en.wikipedia.org/wiki/Gaslighting\">gaslight</a> people to deflect criticism."
- id: topic08p08
  translation: "As of today, the signatories to the overlay factsheet include:"
- id: topic08p09
  translation: "Contributors and editors for <abbr title=\"Web Content Accessibility Guidelines\">WCAG</abbr>, <abbr title=\"Accessible Rich Internet Applications\">ARIA</abbr>, and <abbr title=\"Hypertext Markup Language\">HTML</abbr> specifications"
- id: topic08p10
  translation: "Consultants from <abbr title=\"United States\">US</abbr>, <abbr title=\"United Kingdom\">UK</abbr>, <abbr title=\"Netherlands\">NL</abbr>, <abbr title=\"Canada\">CA</abbr>, <abbr title=\"Japan\">JP</abbr>, <abbr title=\"Germany\">DE</abbr>, <abbr title=\"France\">FR</abbr>, <abbr title=\"Sweden\">SE</abbr>, <abbr title=\"Norway\">NO</abbr>, <abbr title=\"Belgium\">BE</abbr>, <abbr title=\"Poland\">PL</abbr>, <abbr title=\"Australia\">AU</abbr>, <abbr title=\"Denmark\">DK</abbr>, <abbr title=\"Israel\">IL</abbr>, <abbr title=\"Chile\">CL</abbr> and more"
- id: topic08p11
  translation: "Internal accessibility experts for companies like Google, Microsoft, Apple, NBC, Squarespace, BBC, VMWare, Shopify, ServiceNow, Dell, Lyft, HCL, Costco, Expedia, eBay, Cigna, Target, CVS Health, Kijiji, Orange, Pearson, Mitre, Sapient, and Pearson Assessments"
- id: topic08p12
  translation: "Internal accessibility experts from higher education institutions like Syracuse, CSU, Stuttgart Media University, University of Massachusetts, San Francisco State University, Gallaudet University, Carnegie Mellon, West Virginia University, MIT"
- id: topic08p13
  translation: "Lawyers for the disabled"
- id: topic08p14
  translation: "Contributors to assistive technology software such as JAWS and NVDA"
- id: topic08p15
  translation: "Scores of end users with disabilities"
- id: topic08p16
  translation: "Pe scurt, the list of signatories below are people who are experts in this field &amp; have dedicated their professional careers to the improvement of accessibility or are end users with disabilities (or both). Discounting the names listed below as &quot;competitors&quot; is both inaccurate and misses the point: overlays are not an effective means of ensuring accessibility - a point on which all of the people below agree."
- id: topic09
  translation: "Lectură suplimentară"
- id: addYourName
  translation: "Adaugă numele tău la această listă"  
        
      